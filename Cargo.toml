[package]
name = "pgrpc"
version = "0.1.1"
edition = "2021"

[lib]
name = "pgrpc"
path = "src/lib.rs"

[[bin]]
name = "pgrpc_cli"
path = "src/main.rs"

[dependencies]
tokio-postgres = { version = "0.7.12", features = ["with-serde_json-1", "array-impls", "with-time-0_3", "with-uuid-1"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
pg_query = { git = "https://github.com/ZakSingh/pg_query.git", rev = "f1624a88bcf260416b25badb8dc6e3dfb0680f78" }
clap = { version = "4.5.26", features = ["derive"] }
thiserror = "2.0.11"
anyhow = "1.0.95"
regex = "1.11.1"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "3.0", features = ["parsing"] }
heck = "0.5"
prettyplease = "0.3"
itertools = "0.15"
indexmap = "2.6"
postgres-types = { version = "0.2.8", features = ["derive"] }
time = { version = "0.3.44", features = ["serde-well-known", "macros"] }
rayon = "1.10.0"
jsonpath-rust = "1"
toml = "1"
smallvec = { version = "=2.0.0-beta.4", features = ["serde"] }
ustr = { version = "1.1.0", features = ["serde"] }
postgres = {  version = "0.19.10", features = ["with-serde_json-1", "array-impls", "with-time-0_3", "with-uuid-1"] }
log = "0.4.25"
env_logger = "0.11"
bon = "3"
petgraph = "0.8"
postgis-butmaintained = { version = "0.12.0", features = ["serde"] }
pgvector = { version = "0.4", features = ["postgres"] }
glob = "0.3.3"
once_cell = "1.21.3"

[dev-dependencies]
tempfile = "3.15.0"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "blocking"] }
indoc = "2.0"
uuid = { version = "1.0", features = ["v4"] }
libc = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "composite_tosql"
harness = false
